   name: Provjera koda

   on: [push, pull_request]

   jobs:
     provjera:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Instalacija ruff i pytest
           run: pip install -r requirements-dev.txt
         - name: Ruff (linter)
           run: ruff check .
         - name: Ruff (formatiranje)
           run: ruff format --check .
         - name: Pytest (testovi)
           run: pytest -v
